# Builds the app on macOS, Windows and Linux and, for a `v*` tag, publishes a GitHub Release
# with the three builds attached. Run it by hand (workflow_dispatch) to only build.
# Every package contains the app, LICENSE and THIRD_PARTY_LICENSES.txt (generated by cargo-about).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NOTICES_COMMAND: cargo about generate -c packaging/about.toml --fail packaging/about.hbs -o THIRD_PARTY_LICENSES.txt

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo test --release
      - run: ./scripts/bundle.sh --universal --no-install
      - run: ${{ env.NOTICES_COMMAND }}
      - run: |
          mkdir -p "dist/BPM Detector"
          ditto "target/bundle/BPM Detector.app" "dist/BPM Detector/BPM Detector.app"
          cp LICENSE THIRD_PARTY_LICENSES.txt "dist/BPM Detector/"
          ditto -c -k --keepParent "dist/BPM Detector" BPM-Detector-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BPM-Detector-macOS-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo test --release
      - run: cargo build --release
      - run: ${{ env.NOTICES_COMMAND }}
      - run: |
          New-Item -ItemType Directory -Path "dist/BPM Detector" | Out-Null
          Copy-Item target/release/bpm-detector.exe "dist/BPM Detector/BPM Detector.exe"
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.txt "dist/BPM Detector/"
          Compress-Archive -Path "dist/BPM Detector" -DestinationPath BPM-Detector-Windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BPM-Detector-Windows-x86_64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo test --release
      - run: cargo build --release
      - run: ${{ env.NOTICES_COMMAND }}
      - run: |
          mkdir -p dist/bpm-detector
          cp target/release/bpm-detector LICENSE THIRD_PARTY_LICENSES.txt dist/bpm-detector/
          tar -czf BPM-Detector-Linux-x86_64.tar.gz -C dist bpm-detector
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: BPM-Detector-Linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "BPM Detector $GITHUB_REF_NAME" --generate-notes
